<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RestaurOS — Login</title>
  <script src="/js/config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0c0d0f;--surface:#141518;--raised:#1c1d21;--border:#2a2b35;--accent:#4f6ef7;--glow:rgba(79,110,247,.18);--text:#f0f1f5;--muted:#9899a8;--danger:#ef4444;--r:10px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;background-image:radial-gradient(rgba(79,110,247,.05) 1px,transparent 1px);background-size:28px 28px}
    .wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
    .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
    .logo-icon{width:42px;height:42px;background:var(--accent);border-radius:12px;display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 8px var(--glow)}
    .logo-text{font-size:1.4rem;font-weight:800;letter-spacing:-.4px}
    .logo-text span{color:var(--accent)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    h2{font-size:1.05rem;font-weight:700;margin-bottom:4px}
    .sub{font-size:.8rem;color:var(--muted);margin-bottom:24px}
    .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    label{font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
    .iw{position:relative}
    .ii{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
    input{width:100%;background:var(--raised);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:.875rem;font-family:inherit;padding:10px 12px 10px 38px;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
    .btn-login{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:12px;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover:not(:disabled){background:#3a56d4;box-shadow:0 4px 14px rgba(79,110,247,.35)}
    .btn-login:disabled{opacity:.55;cursor:not-allowed}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:var(--r);color:#fca5a5;font-size:.8rem;padding:10px 14px;margin-top:10px;display:none;align-items:center;gap:8px}
    .quick{border-top:1px solid var(--border);margin-top:20px;padding-top:16px}
    .quick-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px}
    .qb{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 12px;background:var(--raised);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:.78rem;font-family:inherit;cursor:pointer;margin-bottom:6px;transition:all .12s;text-align:left}
    .qb:hover{background:#22232a;color:var(--text);border-color:var(--accent)}
    .qbadge{font-size:.65rem;background:var(--glow);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:600}
    .foot{text-align:center;font-size:.72rem;color:#3a3b48}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">🍽️</div>
    <div class="logo-text">Restau<span>rOS</span></div>
  </div>
  <div class="card">
    <h2>Bem-vindo de volta</h2>
    <p class="sub">Faça login para continuar</p>
    <div class="fg">
      <label for="u">Usuário</label>
      <div class="iw"><span class="ii">👤</span><input id="u" type="text" placeholder="seu usuário" autocomplete="username"/></div>
    </div>
    <div class="fg">
      <label for="p">Senha</label>
      <div class="iw"><span class="ii">🔑</span><input id="p" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    </div>
    <button class="btn-login" id="btn"><span id="lbl">Entrar</span></button>
    <div class="err" id="err"><span>⚠️</span><span id="err-txt"></span></div>
    <div class="quick">
      <div class="quick-title">Acesso rápido (MVP)</div>
      <button class="qb" onclick="fill('admin','Lore4545!')"><span>admin / Lore4545!</span><span class="qbadge">Gerente</span></button>
      <button class="qb" onclick="fill('cozinha','Lore4545!')"><span>cozinha / Lore4545!</span><span class="qbadge">Cozinha</span></button>
    </div>
  </div>
  <p class="foot">RestaurOS MVP</p>
</div>
<script>
  const API_URL = (window.API_BASE_URL||'').replace(/\/$/,'');
  if (localStorage.getItem('rs_token')) window.location.href='/admin.html';

  function fill(u,p){ document.getElementById('u').value=u; document.getElementById('p').value=p; hideErr(); }
  function showErr(m){ const e=document.getElementById('err'); document.getElementById('err-txt').textContent=m; e.style.display='flex'; }
  function hideErr(){ document.getElementById('err').style.display='none'; }
  function setLoad(l){ const b=document.getElementById('btn'),lbl=document.getElementById('lbl'); b.disabled=l; lbl.innerHTML=l?'<div class="spinner"></div> Entrando…':'Entrar'; }

  async function doLogin(){
    const u=document.getElementById('u').value.trim();
    const p=document.getElementById('p').value;
    if(!u||!p){ showErr('Preencha usuário e senha'); return; }
    hideErr(); setLoad(true);
    try{
      const res  = await fetch(`${API_URL}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
      const data = await res.json();
      if(!res.ok) throw new Error(data.error||'Credenciais inválidas');
      localStorage.setItem('rs_token', data.data.token);
      localStorage.setItem('rs_user',  JSON.stringify(data.data.user));
      window.location.href = data.data.user.role==='kitchen' ? '/kitchen.html' : '/admin.html';
    }catch(e){ showErr(e.message); setLoad(false); document.getElementById('p').select(); }
  }

  document.getElementById('btn').addEventListener('click', doLogin);
  document.getElementById('p').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('u').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('p').focus(); });
  document.addEventListener('DOMContentLoaded',()=>document.getElementById('u').focus());
</script>
</body>
</html>
