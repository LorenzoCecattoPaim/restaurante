<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c9472a" />
  <title>Cardápio — RestaurOS</title>
  <link rel="stylesheet" href="/css/menu.css" />
</head>
<body>

<!-- ─── Header ──────────────────────────────────────────────── -->
<header class="menu-header">
  <div class="menu-logo">🍽 RestaurOS</div>
  <button class="cart-btn" id="cart-btn" onclick="Cart.toggle()">
    🛒 Pedido
    <span class="cart-badge" id="cart-count">0</span>
  </button>
</header>

<!-- ─── Hero ────────────────────────────────────────────────── -->
<div class="menu-hero">
  <h1>Cardápio</h1>
  <p>Escolha seus pratos favoritos e faça seu pedido</p>
  <div class="table-chip" id="table-chip">📍 Mesa —</div>
</div>

<!-- ─── Category tabs ────────────────────────────────────────── -->
<div class="cat-tabs-wrap">
  <div class="cat-tabs" id="cat-tabs"></div>
</div>

<!-- ─── Products ─────────────────────────────────────────────── -->
<main class="menu-content" id="menu-content">
  <div style="text-align:center;padding:60px;color:#a89b8c">Carregando cardápio…</div>
</main>

<!-- ─── Cart Drawer ───────────────────────────────────────────── -->
<div class="cart-overlay" id="cart-overlay" onclick="Cart.toggle()">
  <div class="cart-drawer" onclick="event.stopPropagation()">
    <div class="cart-drawer-handle"></div>
    <div class="cart-drawer-title">Seu pedido</div>

    <div id="cart-body">
      <div class="cart-empty">Seu carrinho está vazio 🛒</div>
    </div>
  </div>
</div>

<script>
// ─── Detecta mesa pela URL (?mesa=5) ────────────────────────
const urlParams = new URLSearchParams(location.search);
const TABLE_NUMBER = urlParams.get('mesa') || urlParams.get('table') || '—';
document.getElementById('table-chip').textContent = `📍 Mesa ${TABLE_NUMBER}`;

// ─── Estado do carrinho ──────────────────────────────────────
const Cart = (() => {
  let items = [];

  function add(product) {
    const existing = items.find(i => i.productId === product.id);
    if (existing) {
      existing.quantity++;
    } else {
      items.push({ productId: product.id, productName: product.name, unitPrice: product.price, quantity: 1 });
    }
    renderBadge();
    showToast(`${product.name} adicionado!`);
  }

  function remove(productId) {
    const idx = items.findIndex(i => i.productId === productId);
    if (idx === -1) return;
    if (items[idx].quantity > 1) items[idx].quantity--;
    else items.splice(idx, 1);
    renderBadge();
    renderDrawer();
  }

  function total() {
    return items.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
  }

  function count() {
    return items.reduce((s, i) => s + i.quantity, 0);
  }

  function renderBadge() {
    document.getElementById('cart-count').textContent = count();
  }

  function renderDrawer() {
    const body = document.getElementById('cart-body');
    if (items.length === 0) {
      body.innerHTML = '<div class="cart-empty">Seu carrinho está vazio 🛒</div>';
      return;
    }

    const fmt = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

    body.innerHTML = `
      <div class="order-fields">
        <input class="order-input" id="customer-name" placeholder="Seu nome (opcional)" value="${document.getElementById('customer-name')?.value || ''}" />
      </div>

      <div class="cart-items">
        ${items.map(i => `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${i.productName}</div>
              <div class="cart-item-price">${fmt(i.unitPrice)} cada</div>
            </div>
            <div class="qty-control">
              <button class="qty-btn" onclick="Cart.remove(${i.productId})">−</button>
              <span class="qty-value">${i.quantity}</span>
              <button class="qty-btn" onclick="Cart.addById(${i.productId})">+</button>
            </div>
          </div>`).join('')}
      </div>

      <div class="cart-total">
        <span>Total</span>
        <span>${fmt(total())}</span>
      </div>

      <button class="checkout-btn" id="checkout-btn" onclick="Cart.checkout()">
        Confirmar pedido →
      </button>`;
  }

  function toggle() {
    const overlay = document.getElementById('cart-overlay');
    const isOpen  = overlay.classList.contains('open');
    if (!isOpen) renderDrawer();
    overlay.classList.toggle('open');
  }

  function addById(productId) {
    const product = window._products?.find(p => p.id === productId);
    if (product) add(product);
    renderDrawer();
  }

  async function checkout() {
    if (items.length === 0) return;

    const btn  = document.getElementById('checkout-btn');
    const name = document.getElementById('customer-name')?.value.trim() || 'Cliente';

    btn.textContent = 'Enviando…';
    btn.disabled = true;

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tableNumber:  TABLE_NUMBER,
          customerName: name || 'Cliente',
          items: items.map(i => ({ productId: i.productId, quantity: i.quantity })),
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      items = [];
      renderBadge();
      document.getElementById('cart-overlay').classList.remove('open');
      showToast('✅ Pedido enviado! Aguarde na mesa.');

    } catch (e) {
      btn.textContent = 'Confirmar pedido →';
      btn.disabled = false;
      showToast('❌ Erro ao enviar pedido. Tente novamente.');
    }
  }

  return { add, remove, addById, toggle, checkout };
})();

// ─── Toast simples ───────────────────────────────────────────
function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'menu-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ─── Carregar cardápio ───────────────────────────────────────
window._products = [];

async function loadMenu() {
  try {
    const [prodRes, catRes] = await Promise.all([
      fetch('/api/products').then(r => r.json()),
      fetch('/api/categories').then(r => r.json()),
    ]);

    const products   = prodRes.data.filter(p => p.active);
    const categories = catRes.data;
    window._products = products;

    // Category tabs
    const catTabs = document.getElementById('cat-tabs');
    const usedCats = categories.filter(c => products.some(p => p.category === c));

    catTabs.innerHTML = usedCats.map((c, i) =>
      `<button class="cat-tab ${i === 0 ? 'active' : ''}" onclick="scrollToCategory('${c}', this)">${c}</button>`
    ).join('');

    // Render por categoria
    const fmt = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
    const content = document.getElementById('menu-content');

    content.innerHTML = usedCats.map(cat => {
      const catProducts = products.filter(p => p.category === cat);
      if (catProducts.length === 0) return '';

      return `
        <section class="category-section" data-cat="${cat}">
          <h2 class="category-title">${cat}</h2>
          <div class="products-list">
            ${catProducts.map(p => `
              <div class="product-card" onclick="Cart.add(window._products.find(pr=>pr.id===${p.id}))">
                ${p.image
                  ? `<img class="product-card-img" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`
                  : `<div class="product-card-img-placeholder">🍔</div>`
                }
                <div class="product-card-info">
                  <div class="product-card-name">${p.name}</div>
                  <div class="product-card-desc">${p.description || ''}</div>
                  <div class="product-card-footer">
                    <span class="product-card-price">${fmt(p.price)}</span>
                    <button class="add-btn" onclick="event.stopPropagation();Cart.add(window._products.find(pr=>pr.id===${p.id}))">+ Adicionar</button>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </section>`;
    }).join('');

  } catch (e) {
    document.getElementById('menu-content').innerHTML =
      '<div style="text-align:center;padding:60px;color:#a89b8c">Erro ao carregar cardápio.<br>Verifique o servidor.</div>';
  }
}

function scrollToCategory(cat, btn) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const section = document.querySelector(`[data-cat="${cat}"]`);
  if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

loadMenu();
</script>
</body>
</html>
