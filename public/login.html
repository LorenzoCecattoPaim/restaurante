<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RestaurOS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0c0d0f;
      --surface: #141518;
      --border:  #2a2b35;
      --accent:  #4f6ef7;
      --accent-glow: rgba(79,110,247,.15);
      --text:    #f0f1f5;
      --text-sub:#9899a8;
      --danger:  #ef4444;
      --radius:  10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 0 0 6px var(--accent-glow);
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .logo-text span { color: var(--accent); }

    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      font-size: .82rem;
      color: var(--text-sub);
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: .03em;
    }

    input {
      background: #1c1d21;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .9rem;
      font-family: inherit;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 12px;
      font-size: .9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: all .15s;
    }

    .btn-login:hover { opacity: .9; transform: translateY(-1px); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .error-msg {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: var(--radius);
      color: var(--danger);
      font-size: .8rem;
      padding: 10px 14px;
      margin-top: 12px;
      display: none;
    }

    .hints {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .hints-title {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-sub);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .hint-row {
      display: flex;
      justify-content: space-between;
      font-size: .78rem;
      color: var(--text-sub);
      padding: 5px 10px;
      background: #1c1d21;
      border-radius: 6px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: background .12s;
    }

    .hint-row:hover { background: #22232a; }

    .hint-badge {
      font-size: .65rem;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 99px;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-icon">🍽️</div>
    <div class="logo-text">Restau<span>rOS</span></div>
  </div>

  <h2>Bem-vindo de volta</h2>
  <p class="subtitle">Faça login para acessar o painel</p>

  <div class="form-group">
    <label for="username">Usuário</label>
    <input id="username" type="text" placeholder="admin" autocomplete="username" />
  </div>

  <div class="form-group">
    <label for="password">Senha</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
  </div>

  <button class="btn-login" id="btn-login">Entrar no sistema</button>

  <div class="error-msg" id="error-msg"></div>

  <div class="hints">
    <div class="hints-title">Acesso rápido (MVP)</div>
    <div class="hint-row" onclick="fillLogin('admin','admin123')">
      <span>admin / admin123</span>
      <span class="hint-badge">Gerente</span>
    </div>
    <div class="hint-row" onclick="fillLogin('cozinha','cozinha123')">
      <span>cozinha / cozinha123</span>
      <span class="hint-badge">Cozinha</span>
    </div>
  </div>
</div>

<script>
  // Se já tem token válido, redireciona
  const existing = localStorage.getItem('rs_token');
  if (existing) window.location.href = '/admin';

  function fillLogin(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    document.getElementById('username').focus();
  }

  async function doLogin() {
    const btn  = document.getElementById('btn-login');
    const err  = document.getElementById('error-msg');
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    if (!user || !pass) {
      showError('Preencha usuário e senha');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Entrando…';
    err.style.display = 'none';

    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username: user, password: pass }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Credenciais inválidas');

      localStorage.setItem('rs_token', data.data.token);
      localStorage.setItem('rs_user',  JSON.stringify(data.data.user));

      // Redireciona conforme o papel
      window.location.href = data.data.user.role === 'kitchen' ? '/kitchen' : '/admin';

    } catch (e) {
      showError(e.message);
      btn.disabled    = false;
      btn.textContent = 'Entrar no sistema';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent    = msg;
    el.style.display  = 'block';
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
