services:
  - type: web
    name: restauros-api
    runtime: node
    plan: free
    buildCommand: echo "No build needed"
    startCommand: node server/server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: ADMIN_USER
        value: admin

      - key: ADMIN_PASS
        value: admin123

      - key: KITCHEN_USER
        value: cozinha

      - key: KITCHEN_PASS
        value: admin123

      - key: RESTAURANT_NAME
        value: RestaurOS

      # ✅ CORRIGIDO AQUI
      - key: ALLOWED_ORIGIN
        value: https://restaurante-delta-ashy.vercel.app