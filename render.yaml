services:
  - type: web
    name: restauros-api
    runtime: node
    plan: free
    buildCommand: echo "No build needed"
    startCommand: node server/server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: ADMIN_USER
        value: admin

      - key: ADMIN_PASS
        value: Lore4545!

      - key: KITCHEN_USER
        value: cozinha

      - key: KITCHEN_PASS
        value: Lore4545!

      - key: RESTAURANT_NAME
        value: Nome do Restaurante

      # ✅ CORRIGIDO AQUI
      - key: ALLOWED_ORIGIN
        value: https://restaurante-delta-ashy.vercel.app

      # Persistência real (Supabase) — sync:false = Render pede o valor no
      # dashboard (Environment) e NUNCA guarda o segredo neste arquivo/Git.
      # Sem essas duas vars, o app volta pro modo memória de sempre.
      # Passo a passo: ver scripts/supabase_setup.sql e o README.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false