<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RestaurOS — Garçom</title>
  <script src="/js/config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0b0d;--surface:#111214;--raised:#18191e;--border:#252630;--accent:#4f6ef7;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#38bdf8;--text:#ecedf2;--muted:#5a5b68}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    .wt-header{background:var(--surface);border-bottom:1px solid var(--border);min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;position:sticky;top:0;z-index:30;flex-shrink:0;gap:10px;flex-wrap:wrap}
    .wt-logo{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700}
    .wt-logo-icon{width:30px;height:30px;background:var(--accent);border-radius:8px;display:grid;place-items:center;font-size:16px}
    .wt-hello{font-size:.78rem;color:var(--muted)}
    .wt-meta{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
    .wt-live{display:flex;align-items:center;gap:5px;color:var(--success);font-weight:600;font-size:.75rem}
    .wt-live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--success);animation:blink 1.4s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .wt-clock{font-family:'DM Mono',monospace;font-size:.82rem}
    .wbtn{background:var(--raised);border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:6px 11px;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .12s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
    .wbtn:hover{color:var(--text)}
    .wt-body{flex:1;padding:18px;max-width:820px;width:100%;margin:0 auto}
    .wt-section-title{font-size:.82rem;font-weight:700;letter-spacing:.02em;color:var(--text);margin:22px 0 10px;display:flex;align-items:center;gap:7px}
    .wt-section-title:first-child{margin-top:0}
    .wt-count{background:var(--raised);border:1px solid var(--border);border-radius:99px;padding:1px 9px;font-size:.7rem;color:var(--muted)}
    .wt-list{display:flex;flex-direction:column;gap:10px}
    .wcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;animation:cin .2s cubic-bezier(.34,1.56,.64,1)}
    @keyframes cin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .wcard[data-status="pending"]{border-left:3px solid var(--danger)}
    .wcard[data-status="accepted"]{border-left:3px solid var(--warning)}
    .wcard-main{display:flex;flex-direction:column;gap:3px;min-width:0}
    .wcard-table{font-size:1.05rem;font-weight:800}
    .wcard-desc{font-size:.8rem;color:var(--muted)}
    .wcard-time{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-top:2px}
    .wcard-time.urgent{color:var(--danger);font-weight:700}
    .wbtn-action{border:none;border-radius:8px;padding:10px 16px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .12s}
    .wbtn-action:hover{opacity:.9}
    .wbtn-action.assumir{background:var(--accent);color:#fff}
    .wbtn-action.concluir{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3)}
    .wt-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;color:var(--muted);text-align:center;gap:6px;background:var(--surface);border:1px dashed var(--border);border-radius:12px}
    .wt-empty-icon{font-size:1.7rem}
    .wt-empty-title{font-size:.82rem}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  </style>
</head>
<body>
<header class="wt-header">
  <div class="wt-logo"><div class="wt-logo-icon">🙋</div>RestaurOS · Garçom</div>
  <div class="wt-hello" id="hello"></div>
  <div class="wt-meta">
    <div class="wt-live">Ao vivo</div>
    <div class="wt-clock" id="clock">--:--</div>
    <button class="wbtn" id="sound-btn">🔔</button>
    <a class="wbtn" href="/admin" id="link-accounts">🧾 Contas / Pedidos</a>
    <button class="wbtn" onclick="doLogout()">Sair</button>
  </div>
</header>

<div class="wt-body">
  <div class="wt-section-title">🔴 Chamados pendentes <span class="wt-count" id="pending-count">0</span></div>
  <div class="wt-list" id="pending-board">
    <div class="wt-empty"><div class="wt-empty-icon">⏳</div><div class="wt-empty-title">Carregando…</div></div>
  </div>

  <div class="wt-section-title">🟡 Meus atendimentos <span class="wt-count" id="mine-count">0</span></div>
  <div class="wt-list" id="mine-board">
    <div class="wt-empty"><div class="wt-empty-icon">✅</div><div class="wt-empty-title">Nenhum atendimento em andamento</div></div>
  </div>
</div>

<script>
const API_URL = (window.API_BASE_URL||'').replace(/\/$/,'');
const token    = localStorage.getItem('rs_token');
const me       = JSON.parse(localStorage.getItem('rs_user')||'{}');
if (!token) window.location.href='/login.html';
const H = {'Content-Type':'application/json','Authorization':`Bearer ${token}`};

document.getElementById('hello').textContent = me.name ? `Olá, ${me.name.split(' ')[0]}!` : '';

async function doLogout(){
  await fetch(`${API_URL}/api/auth/logout`,{method:'POST',headers:H}).catch(()=>{});
  localStorage.removeItem('rs_token'); localStorage.removeItem('rs_user');
  window.location.href='/login.html';
}

let _calls=[], _known=new Set(), _ctx=null, _sound=localStorage.getItem('rs_sound')!=='false';
updateSoundBtn();

setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});},1000);
document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function secsSince(iso){return Math.floor((Date.now()-new Date(iso))/1000);}
function fmtWait(s){ if(s<60) return `${s}s`; const m=Math.floor(s/60); return `${m}min${s%60?` ${s%60}s`:''}`; }

// Um garçom vê e pode assumir qualquer chamado pendente da casa; depois de
// assumido, só ele (ou o gerente) mexe nele — o backend confirma isso
// (POST /calls/:id/accept e /complete usam a sessão, nunca um id do body).
function render(){
  const pending = _calls.filter(c=>c.status==='pending');
  const mine    = _calls.filter(c=>c.status==='accepted' && c.acceptedBy && c.acceptedBy.id===me.id);

  document.getElementById('pending-count').textContent = pending.length;
  document.getElementById('mine-count').textContent    = mine.length;

  const pb = document.getElementById('pending-board');
  pb.innerHTML = pending.length ? pending.map(c=>{
    const w = secsSince(c.createdAt);
    return `<div class="wcard" data-status="pending" data-id="${c.id}">
      <div class="wcard-main">
        <div class="wcard-table">Mesa ${esc(c.tableNumber)}</div>
        <div class="wcard-desc">${c.type==='conta'?'🧾':'🙋'} ${esc(c.typeLabel)}</div>
        <div class="wcard-time ${w>=180?'urgent':''}" data-created="${c.createdAt}">⏱ há ${fmtWait(w)}</div>
      </div>
      <button class="wbtn-action assumir" onclick="accept(${c.id})">ASSUMIR</button>
    </div>`;
  }).join('') : `<div class="wt-empty"><div class="wt-empty-icon">✅</div><div class="wt-empty-title">Nenhum chamado pendente</div></div>`;

  const mb = document.getElementById('mine-board');
  mb.innerHTML = mine.length ? mine.map(c=>{
    const w = secsSince(c.acceptedAt);
    return `<div class="wcard" data-status="accepted" data-id="${c.id}">
      <div class="wcard-main">
        <div class="wcard-table">Mesa ${esc(c.tableNumber)}</div>
        <div class="wcard-desc">${c.type==='conta'?'🧾':'🙋'} ${esc(c.typeLabel)} · em atendimento</div>
        <div class="wcard-time" data-accepted="${c.acceptedAt}">⏱ há ${fmtWait(w)}</div>
      </div>
      <button class="wbtn-action concluir" onclick="complete(${c.id})">CONCLUIR</button>
    </div>`;
  }).join('') : `<div class="wt-empty"><div class="wt-empty-icon">✅</div><div class="wt-empty-title">Nenhum atendimento em andamento</div></div>`;
}

async function accept(id){
  try{
    const res = await fetch(`${API_URL}/api/calls/${id}/accept`,{method:'POST',headers:H});
    const data = await res.json();
    if(!res.ok){ alert(data.error||'Não foi possível assumir — talvez outro garçom já tenha assumido.'); await fetchCalls(); return; }
    await fetchCalls();
  }catch{ alert('Erro de conexão. Tente novamente.'); }
}

async function complete(id){
  try{
    const res = await fetch(`${API_URL}/api/calls/${id}/complete`,{method:'POST',headers:H});
    const data = await res.json();
    if(!res.ok){ alert(data.error||'Não foi possível concluir.'); await fetchCalls(); return; }
    await fetchCalls();
  }catch{ alert('Erro de conexão. Tente novamente.'); }
}

async function fetchCalls(){
  try{
    const res = await fetch(`${API_URL}/api/calls`,{headers:H});
    if(res.status===401){ window.location.href='/login.html'; return; }
    const data = await res.json();
    const list = data.data||[];
    const newPending = list.filter(c=>c.status==='pending'&&!_known.has(c.id));
    if(newPending.length && _known.size>0){ playAlert(); document.title=`🔔 ${newPending.length} chamado(s)`; setTimeout(()=>{document.title='RestaurOS — Garçom';},3000); }
    list.forEach(c=>_known.add(c.id));
    _calls = list;
    render();
  }catch{}
}

function refreshTimers(){
  document.querySelectorAll('[data-created]').forEach(el=>{
    const w=secsSince(el.dataset.created);
    el.textContent=`⏱ há ${fmtWait(w)}`;
    el.classList.toggle('urgent', w>=180);
  });
  document.querySelectorAll('[data-accepted]').forEach(el=>{
    el.textContent=`⏱ há ${fmtWait(secsSince(el.dataset.accepted))}`;
  });
}

function getCtx(){ if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)(); return _ctx; }
function tone(f,d,dur=.25){ try{ const ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(.25,ctx.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+dur); o.start(ctx.currentTime+d); o.stop(ctx.currentTime+d+dur); }catch{} }
function playAlert(){ if(!_sound) return; [[520,0],[660,.16]].forEach(([f,d])=>tone(f,d)); }
function toggleSound(){ _sound=!_sound; localStorage.setItem('rs_sound',_sound); updateSoundBtn(); }
function updateSoundBtn(){ const b=document.getElementById('sound-btn'); if(b) b.textContent=_sound?'🔔':'🔕'; }
document.getElementById('sound-btn')?.addEventListener('click', toggleSound);
document.addEventListener('click',()=>{ try{ getCtx(); }catch{} },{once:true});

const POLL_MS = (window.CONFIG && CONFIG.CALLS_POLL_INTERVAL) || 5000;
fetchCalls();
setInterval(fetchCalls, POLL_MS);
setInterval(refreshTimers, 5000);
</script>
</body>
</html>
